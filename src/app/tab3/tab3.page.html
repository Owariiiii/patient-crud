<ion-header>
  <ion-toolbar>
    <ion-title>
      Care Guide
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding care-guide">
  <div class="guide-hero">
    <ion-icon name="heart-outline"></ion-icon>
    <p class="eyebrow">A LITTLE REMINDER</p>
    <h1>Every record tells a story.</h1>
    <p>Keep patient details current so every visit starts with better context.</p>
  </div>
  <ion-list lines="none">
    <ion-item><ion-icon slot="start" name="checkmark-circle-outline"></ion-icon><ion-label>Confirm contact details</ion-label></ion-item>
    <ion-item><ion-icon slot="start" name="document-text-outline"></ion-icon><ion-label>Keep notes clear and useful</ion-label></ion-item>
    <ion-item><ion-icon slot="start" name="time-outline"></ion-icon><ion-label>Review follow-up patients</ion-label></ion-item>
  </ion-list>
</ion-content>
