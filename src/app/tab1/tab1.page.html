<ion-header>
  <ion-toolbar>
    <ion-title>Patient Records</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <section class="intro">
    <p class="eyebrow">PATIENT INTAKE</p>
    <h1>Add a patient</h1>
    <p class="subtitle">Create a complete record for your care team.</p>
  </section>

  <form (ngSubmit)="addPatient()" class="patient-form">
    <ion-item lines="none">
      <ion-icon slot="start" name="person-outline"></ion-icon>
      <ion-input label="Full name *" labelPlacement="stacked" placeholder="e.g. Maria Santos" [(ngModel)]="newPatient.name" name="name"></ion-input>
    </ion-item>
    <ion-item lines="none">
      <ion-icon slot="start" name="mail-outline"></ion-icon>
      <ion-input type="email" label="Email *" labelPlacement="stacked" placeholder="patient@email.com" [(ngModel)]="newPatient.email" name="email"></ion-input>
    </ion-item>
    <div class="field-row">
      <ion-item lines="none">
        <ion-icon slot="start" name="calendar-outline"></ion-icon>
        <ion-input type="number" label="Age *" labelPlacement="stacked" placeholder="Age" [(ngModel)]="newPatient.age" name="age"></ion-input>
      </ion-item>
      <ion-item lines="none">
        <ion-select label="Gender" labelPlacement="stacked" [(ngModel)]="newPatient.gender" name="gender">
          <ion-select-option value="Female">Female</ion-select-option>
          <ion-select-option value="Male">Male</ion-select-option>
          <ion-select-option value="Other">Other</ion-select-option>
        </ion-select>
      </ion-item>
    </div>
    <ion-item lines="none">
      <ion-select label="Care status" labelPlacement="stacked" [(ngModel)]="newPatient.status" name="status">
        <ion-select-option value="Active">Active</ion-select-option>
        <ion-select-option value="Follow-up">Follow-up</ion-select-option>
        <ion-select-option value="Discharged">Discharged</ion-select-option>
      </ion-select>
    </ion-item>
    <ion-item lines="none">
      <ion-textarea label="Notes" labelPlacement="stacked" autoGrow="true" placeholder="Add symptoms, reminders, or care notes" [(ngModel)]="newPatient.notes" name="notes"></ion-textarea>
    </ion-item>
    <ion-button expand="block" type="submit" class="save-button">
      <ion-icon slot="start" name="add-circle-outline"></ion-icon>
      Save patient
    </ion-button>
  </form>
</ion-content>
